[project]
name = "aic"
version = "0.1.0"
description = "AI Assistant project with FastAPI and LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "langgraph>=1.0.5",
    "pymilvus>=2.6.5",
    "loguru>=0.7.3",
    "langchain>=1.2.0",
    "langchain-openai>=1.1.6",
    "langchain-text-splitters>=1.1.0",
    "docker>=7.0.0",
    "jinja2>=3.1.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tiktoken>=0.12.0",
    "opik>=1.9.92",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    "venv/",
    "build/",
    "dist/",
    "*.egg-info/",
    "logs/"
]

[tool.ruff.lint]
select = [  # 启用的规则集（推荐组合）
    "E",  # pycodestyle 错误规则
    "W",  # pycodestyle 警告规则
    "F",  # pyflakes 规则
    "I",  # isort 导入排序规则
    "UP", # pyupgrade 规则（升级语法，如 f-string 替代 .format）
    "C",  # flake8-comprehensions 规则（优化列表推导式）
    "B",  # flake8-bugbear 规则（常见 bug 检测）
    "S",  # flake8-bandit 安全规则（检测安全漏洞）
]
ignore = [  # 忽略的具体规则
    "E501",  # 忽略行长度超限（由 format 统一处理）
    "W293",  # 忽略空白行警告
    "I001",  # 忽略导入排序的特定规则（如需自定义）
]

[tool.ruff.format]
quote-style = "double"  # 字符串引号风格（double/single）
indent-style = "space"  # 缩进风格（space/tab）

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
